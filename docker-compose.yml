# Requires a .env file: copy .env.example and fill it in. Compose refuses to start
# without the secrets, so no deployment can run on shared default credentials.
#
# PostgreSQL is reachable from this host only, and bundle storage only from the app. For production, prefer a
# managed PostgreSQL with backups, and terminate TLS in front of the app.
services:
  app:
    image: ${ZENTINEL_CP_IMAGE:-ghcr.io/zentinelproxy/zentinel-control-plane:main}
    # To build locally instead, comment out `image` and uncomment:
    # build: .
    ports:
      - "${ZENTINEL_CP_BIND:-127.0.0.1}:4000:4000"
    environment:
      DATABASE_URL: "ecto://zentinel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/zentinel_cp"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "4000"
      FORCE_SSL: "${FORCE_SSL:-false}"
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-0}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      S3_ENDPOINT: "http://storage:9000"
      S3_BUCKET: "zentinel-bundles"
      S3_ACCESS_KEY_ID: "${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}"
      S3_SECRET_ACCESS_KEY: "${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}"
      S3_REGION: "us-east-1"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zentinel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: zentinel_cp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentinel -d zentinel_cp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible bundle storage. MinIO no longer publishes community images,
  # so this uses RustFS. Any S3-compatible store works; set S3_* to use another.
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.4}
    environment:
      RUSTFS_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}"
      AWS_SECRET_ACCESS_KEY: "${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}"
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://storage:9000 s3api head-bucket --bucket zentinel-bundles || aws --endpoint-url http://storage:9000 s3 mb s3://zentinel-bundles

volumes:
  pgdata:
  storagedata:
