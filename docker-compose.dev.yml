# Dev dependencies only. Phoenix runs on the host via `mise run dev:up`.
#
# Development stores bundles on the local filesystem by default. This provides
# an S3-compatible store, RustFS, for working on the S3 code path.
services:
  storage:
    image: rustfs/rustfs:1.0.4
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: devaccess
      RUSTFS_SECRET_KEY: devsecretkey
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: devaccess
      AWS_SECRET_ACCESS_KEY: devsecretkey
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://storage:9000 s3 mb s3://zentinel-bundles || true

volumes:
  storagedata:
